<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lyrics — Prevail In Darkness</title><link rel="stylesheet" href="style.css"></head><body><script src="site.js"></script><script src="singles-data.js"></script><script>
const q=new URLSearchParams(location.search),id=+q.get('id'),track=+q.get('track')||0;
const x=SINGLES_DATA[id]||SINGLES_DATA[0], song=x.tracks[track]||x.tracks[0];
document.title=`${song.title} — Prevail In Darkness`;
document.body.innerHTML=head('SINGLES')+`<main class="lyric-page"><div class="kicker">${x.title} · ${x.year}</div><h1 class="section-title lyric-title">${song.title}</h1><div class="lyric-copy"><pre>${song.lyrics}</pre><div class="credits">${song.credits.map(c=>`<div>${c}</div>`).join('')}</div></div><p><a class="btn secondary" href="single.html?id=${id}">← BACK TO RELEASE</a></p></main>`+footer();
</script></body></html>
