<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lyrics — Prevail In Darkness</title><link rel="stylesheet" href="style.css"></head><body><script src="site.js"></script><script src="lionheart-lyrics.js"></script><script src="terminal-lyrics.js"></script><script src="inferno-lyrics.js"></script><script>const q=new URLSearchParams(location.search),rid=q.get('release'),r=releases[rid],i=+q.get('track'),t=r?.tracks[i]||'LYRICS',c=TRACK_CREDITS[rid]?.[i]||[];document.title=`${t} — Prevail In Darkness`;document.body.innerHTML=head(r?.title||'')+`<main class="lyric-page"><div class="kicker">${r?.title||''}</div><h1 class="section-title lyric-title">${t}</h1><div id="lyrics" class="lyric-copy"><pre>${rid==='lionheart' ? (LIONHEART_LYRICS[i] || 'INSTRUMENTAL') : rid==='terminal' ? (TERMINAL_LYRICS[i] || 'INSTRUMENTAL') : rid==='inferno' ? (INFERNO_LYRICS[i] || 'INSTRUMENTAL') : 'Official lyric text is being transferred verbatim into the archive.'}</pre><div class="song-credit">${c.map(x=>`<div>${x}</div>`).join('')}</div></div><p><a class="btn secondary" href="${rid}.html">← BACK TO ${r?.title||'RELEASE'}</a></p></main>`+footer()</script></body></html>
