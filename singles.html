<!doctype html>

<html>

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Singles — Prevail In Darkness</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<script src="site.js"></script>

<script>

const singlesReleases=[

['SOLUTION: BLOOD','2015','solution-blood.jpg','single.html?id=0','Two-track single'],

['NAUSEATING PAIN','2015','nauseating-pain.jpg','single.html?id=1',''],

['ENTER THE DARKNESS','2015','enter-the-darkness.jpg','ep.html?id=0','DEMO EP'],

['MY JOURNEY ENDS WITHIN','2016','my-journey-ends-within.jpg','lyrics.html?release=lionheart&track=7','SINGLE','Niklas Sundin'],

['LIONHEART','2016','lionheart-single.jpg','lyrics.html?release=lionheart&track=4','SINGLE','Niklas Sundin'],

['DOWN THROUGH THE GARDENS','2016','down-through-the-gardens.jpg','lyrics.html?release=lionheart&track=1','SINGLE','Niklas Sundin'],

['DAMNATION','2017','damnation.jpg','ep.html?id=1','DEMO EP'],

['THE IMMORTALS','2017','the-immortals.jpg','ep.html?id=2','COMPILATION EP'],

['HARDSHIPS (feat. Tomas Lindberg)','2018','hardships.jpg','lyrics.html?release=terminal&track=4','SINGLE','Emil Hermansson'],

['IN DEATH WE TRUST (feat. Tomas Lindberg)','2018','in-death-we-trust.jpg','single.html?id=2','SINGLE'],

['FOR VENGEANCE SAKE','2020','for-vengeance-sake.jpg','single.html?id=3','SINGLE'],

['OF SNOW AND ICE (All It Takes - Part 3)','2020','of-snow-and-ice.jpg','single.html?id=4','SINGLE'],

['ALL IT TAKES — THE TRILOGY','2021','all-it-takes-trilogy.jpg','#trilogy','SPECIAL RELEASE'],

['ALL THAT AVAILS IS FLIGHT','2023','all-that-avails-is-flight.jpg','lyrics.html?release=inferno&track=1','SINGLE','Emil Hermansson']

];

let cards='';

singlesReleases.forEach(function(x){

  let button='VIEW LYRICS';

  if(x[3]==='#trilogy'){

    button='VIEW TRILOGY';

  }else if(x[3].startsWith('ep.html')){

    button='VIEW RELEASE';

  }

  cards +=

    '<article class="card">' +

    '<img src="assets/' + x[2] + '" alt="' + x[0] + ' artwork">' +

    '<h2>' + x[0] + '</h2>' +

    '<div class="year">RELEASED: ' + x[1] + '</div>' +

    (x[4] ? '<p class="note">' + x[4] + '</p>' : '') +
    (x[5] ? '<p class="note">Artwork by: ' + x[5] + '</p>' : '') +

    '<p><a class="btn" href="' + x[3] + '">' + button + '</a></p>' +

    '</article>';

});

const trilogy =

  '<section class="feature" id="trilogy">' +

  '<img src="assets/all-it-takes-trilogy.jpg" alt="All It Takes - The Trilogy artwork">' +

  '<div>' +

  '<div class="kicker">SPECIAL RELEASE · 2021</div>' +

  '<h2 class="section-title" style="font-size:36px">ALL IT TAKES — THE TRILOGY</h2>' +

  '<p>Three connected songs across LIONHEART, TERMINAL and SINGLES.</p>' +

  '<p class="trilogy-links">' +

  '<a href="lyrics.html?release=lionheart&track=9">ALL IT TAKES <small>— LIONHEART</small></a><br>' +

  '<a href="lyrics.html?release=terminal&track=13">STRIKE FROM THE ASHES (All It Takes - Part 2) <small>— TERMINAL</small></a><br>' +

  '<a href="single.html?id=4">OF SNOW AND ICE (All It Takes - Part 3) <small>— SINGLE</small></a>' +

  '</p>' +

  '</div>' +

  '</section>';

document.body.innerHTML =

  head('SINGLES') +

  '<main>' +

  '<h1 class="section-title">SINGLES</h1>' +

  '<div class="grid">' + cards + '</div>' +

  trilogy +

  '</main>' +

  footer();

</script>

</body>

</html>
